org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# Store this register belongs to, and the Realtime Database it syncs with.
caisse.storeId=demo-store
caisse.firebaseDatabaseUrl=https://caisse-demo-default-rtdb.europe-west1.firebasedatabase.app
# Debug builds only: talk to the local Firebase emulators (see the README) instead of the project.
caisse.useFirebaseEmulator=false
